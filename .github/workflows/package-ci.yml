name: Package CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  package-verification:
    name: Package verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify:package

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: |
          # The Actions job is a container; Compose publishes ports on the Docker host.
          export LIVESYNC_INTEGRATION_HOST="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          test -n "$LIVESYNC_INTEGRATION_HOST"
          npm run test:integration:managed

  package-boundary:
    name: Complete package gate
    if: always()
    needs:
      - package-verification
      - integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all package checks
        env:
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          PACKAGE_RESULT: ${{ needs.package-verification.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
