when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  - name: verify-package
    image: dhi.io/node:26.12.1-alpine3.24-dev@sha256:0614d22bcdfe1f5fbf985e68b455e61aefba8bc697894a6e91a8542a3e5f26b4
    commands:
      - npm ci --ignore-scripts --no-audit --no-fund
      - npm run verify:package
